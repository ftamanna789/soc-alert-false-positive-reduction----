[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-alert-false-positive-reduction"
version = "0.1.0"
description = "Reproducible reference experiments for SOC alert false-positive reduction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
autoencoder = ["tensorflow>=2.15"]
tabnet = ["torch>=2", "pytorch-tabnet>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
